<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>呪文の練習場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 一画面の夜の練習場。3Dを全面に敷き、下に詠唱の操作盤を重ねる（暗い一色の世界を選んでいる） */
:root{
  --night:#0d0b1c; --panel:rgba(20,16,40,.82); --line:rgba(196,178,255,.22);
  --ink:#ece7ff; --muted:#a79fcc; --gold:#f2c46b; --fail:#ff8a7a; --on:#ff6b8b;
  --display:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;transition:filter .3s}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:#fff}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;pointer-events:none;display:flex;flex-direction:column;gap:2px}
.top h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(20px,3.4vw,30px);letter-spacing:.08em;color:var(--gold);text-shadow:0 0 18px rgba(242,196,107,.35)}
.top p{margin:0;font-size:12px;color:var(--muted);max-width:34em}
#banner{position:fixed;left:0;right:0;top:22%;text-align:center;pointer-events:none;font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,56px);letter-spacing:.12em;color:#fff;opacity:0;text-shadow:0 0 24px var(--bc,#fff),0 0 4px #000;transition:opacity .25s,transform .25s;transform:scale(.9)}
#banner.show{opacity:1;transform:scale(1)}
#banner small{display:block;font-size:.38em;letter-spacing:.3em;color:var(--gold)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none}
.dock-in{pointer-events:auto;max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(8px)}
.casters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.casters span{font-size:12px;color:var(--muted);margin-right:4px}
.casters button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.casters button[aria-checked="true"]{border-color:var(--gold);color:var(--gold);background:rgba(242,196,107,.1)}
.readout{min-height:44px;display:flex;flex-direction:column;gap:6px}
#heard{font-family:var(--display);font-size:17px;line-height:1.4;overflow-wrap:anywhere}
#heard.idle{color:var(--muted);font-family:var(--body);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.chip{border:1px solid var(--line);border-radius:6px;padding:2px 8px;display:inline-flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip.fail{border-color:var(--fail);color:var(--fail)}
.chip.lv{color:var(--gold);border-color:rgba(242,196,107,.5);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:stretch}
#mic{flex:none;width:56px;height:56px;border-radius:50%;border:1px solid var(--gold);background:rgba(242,196,107,.12);color:var(--gold);cursor:pointer;display:grid;place-items:center}
#mic.on{background:var(--on);border-color:var(--on);color:#fff;box-shadow:0 0 0 6px rgba(255,107,139,.25)}
#mic svg{width:24px;height:24px}
form{flex:1;min-width:0;display:flex;gap:6px}
#spellText{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:0 12px}
form button{font:inherit;font-weight:700;color:var(--night);background:var(--gold);border:0;border-radius:10px;padding:0 16px;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#note{font-size:12px;color:var(--fail)}
#note:empty{display:none}
details{font-size:13px}
summary{cursor:pointer;color:var(--muted)}
.lists{max-height:30vh;overflow:auto;padding-top:8px;display:flex;flex-direction:column;gap:10px}
.samples{display:flex;flex-wrap:wrap;gap:6px}
.samples button{font:inherit;font-size:12px;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer;text-align:left}
.dict{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 14px;font-size:12px;color:var(--muted)}
.dict b{color:var(--ink);font-weight:700}
.hint{font-size:12px;color:var(--muted);margin:0}
</style>

<canvas id="stage"></canvas>
<div id="flash"></div>
<header class="top">
  <h1>呪文の練習場</h1>
  <p>魔法使いを選んで、マイクを押して唱えてください。長く凝った呪文ほど威力が上がります。辞書にない呪文は失敗します。</p>
</header>
<div id="banner"></div>
<section class="dock">
  <div class="dock-in">
    <div class="casters" role="radiogroup" aria-label="唱える魔法使い"><span>唱える人</span></div>
    <div class="readout">
      <div id="heard" class="idle">ここに聞き取った呪文が出ます</div>
      <div id="verdict" class="chips"></div>
    </div>
    <div class="row">
      <button id="mic" type="button" aria-label="マイクで唱える"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <form id="typed"><input id="spellText" autocomplete="off" placeholder="文字でも唱えられます" aria-label="呪文"><button type="submit">唱える</button></form>
    </div>
    <div id="note"></div>
    <details>
      <summary>呪文の例と辞書</summary>
      <div class="lists">
        <div class="samples" id="samples"></div>
        <p class="hint"><a href="game.html" style="color:var(--gold)">ゲーム「呪文の迎撃戦」</a>　<a href="about.html" style="color:var(--gold)">このページのしくみ</a>　対象は「あか・あお・みどり」（かかし）、「右・左・真ん中」、「全員」、「仲間」、「自分」、魔法使いの名前で指定できます。威力は長さ、区切りの数、効果の言葉の数、「大いなる・究極・古の」などの言葉で上がり、「ぷち・ちょっと」で下がります。</p>
        <div class="dict" id="dict"></div>
      </div>
    </details>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const R=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const C=h=>new THREE.Color(h);
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 描画の土台 ---------- */
const canvas=$('#stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();
scene.background=C(0x0d0b1c);
scene.fog=new THREE.Fog(0x0d0b1c,22,60);
const camera=new THREE.PerspectiveCamera(45,1,.1,200);
const camBase=V(0,10.5,18.5), camLook=V(0,-.6,-.6);
function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.fov=w/h<.8?68:45;camBase.set(0,w/h<.8?12:10.5,w/h<.8?20:18.5);camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

scene.add(new THREE.HemisphereLight(0x5a50a0,0x120e20,.6));
const sun=new THREE.DirectionalLight(0xfff1dd,.75);sun.position.set(6,12,8);scene.add(sun);

function canvasTex(size,draw){const c=document.createElement('canvas');c.width=c.height=size;draw(c.getContext('2d'),size);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;}
const dotTex=canvasTex(64,(g,s)=>{const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.35,'rgba(255,255,255,.55)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,s,s);});
const puffTex=canvasTex(64,(g,s)=>{const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,'rgba(255,255,255,.9)');r.addColorStop(.6,'rgba(255,255,255,.35)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,s,s);});
const bubbleTex=canvasTex(64,(g,s)=>{g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=3;g.beginPath();g.arc(s/2,s/2,s/2-4,0,7);g.stroke();g.fillStyle='rgba(255,255,255,.12)';g.fill();g.fillStyle='rgba(255,255,255,.9)';g.beginPath();g.arc(s*.36,s*.34,5,0,7);g.fill();});
const circleTex=canvasTex(512,(g,s)=>{
  const c=s/2;g.strokeStyle='#fff';g.fillStyle='#fff';
  const ring=(r,w)=>{g.lineWidth=w;g.beginPath();g.arc(c,c,r,0,Math.PI*2);g.stroke();};
  ring(246,6);ring(226,3);ring(170,4);ring(120,2);
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let i=0;i<48;i++){const a=i/48*Math.PI*2;g.save();g.translate(c+Math.cos(a)*198,c+Math.sin(a)*198);g.rotate(a+Math.PI/2);g.lineWidth=3;g.beginPath();
    const n=2+Math.floor(rnd()*3);for(let k=0;k<n;k++){const x=(rnd()-.5)*16,y=(rnd()-.5)*18;g.moveTo(x,y);g.lineTo(x+(rnd()-.5)*14,y+(rnd()-.5)*14);}g.stroke();g.restore();}
  g.lineWidth=4;for(let t=0;t<2;t++){g.beginPath();for(let i=0;i<=3;i++){const a=i/3*Math.PI*2+t*Math.PI/3-Math.PI/2;const x=c+Math.cos(a)*170,y=c+Math.sin(a)*170;i?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();}
  for(let i=0;i<6;i++){const a=i/6*Math.PI*2-Math.PI/2;g.lineWidth=3;g.beginPath();g.arc(c+Math.cos(a)*170,c+Math.sin(a)*170,16,0,7);g.stroke();}
  g.beginPath();g.arc(c,c,22,0,7);g.fill();
});
const texCache={};
function textTex(str,color='#fff',bold=true){const key=str+color;if(texCache[key])return texCache[key];
  return texCache[key]=canvasTex(128,(g,s)=>{g.font=`${bold?'700 ':''}84px "Zen Kaku Gothic New","Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillStyle=color;g.fillText(str,s/2,s/2+6);});}
function wideTextTex(str,color){return canvasTex(512,(g,s)=>{g.font='800 92px "Shippori Mincho B1",serif';g.textAlign='center';g.textBaseline='middle';g.lineWidth=10;g.strokeStyle='rgba(0,0,0,.7)';g.strokeText(str,s/2,s/2);g.fillStyle=color;g.fillText(str,s/2,s/2);});}

/* 地面と周り */
const ground=new THREE.Mesh(new THREE.CircleGeometry(24,64),new THREE.MeshStandardMaterial({color:0x17132a,roughness:.95}));
ground.rotation.x=-Math.PI/2;scene.add(ground);
const floorCircle=new THREE.Mesh(new THREE.PlaneGeometry(15,15),new THREE.MeshBasicMaterial({map:circleTex,color:0x5c4fa8,transparent:true,opacity:.35,depthWrite:false,blending:THREE.AdditiveBlending}));
floorCircle.rotation.x=-Math.PI/2;floorCircle.position.y=.01;scene.add(floorCircle);
for(let i=0;i<10;i++){const a=i/10*Math.PI*2;if(Math.sin(a)*15-1>6)continue;const p=new THREE.Mesh(new THREE.CylinderGeometry(.45,.55,4,8),new THREE.MeshStandardMaterial({color:0x3b3458,roughness:.9,flatShading:true}));p.position.set(Math.cos(a)*15,2,Math.sin(a)*15-1);scene.add(p);
  const f=new THREE.Sprite(new THREE.SpriteMaterial({map:dotTex,color:0xffa24a,blending:THREE.AdditiveBlending,depthWrite:false}));f.scale.setScalar(1.4);f.position.set(p.position.x,4.4,p.position.z);scene.add(f);}
{const n=600,pos=new Float32Array(n*3);for(let i=0;i<n;i++){const u=R(.05,1),t=R(0,Math.PI*2),r=80;const s=Math.sqrt(1-u*u);pos.set([Math.cos(t)*s*r,u*r,Math.sin(t)*s*r],i*3);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xcfc8ff,size:.35,map:dotTex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending})));}

/* ---------- 粒 ---------- */
class Pool{
  constructor(n,size,tex=dotTex){this.n=n;this.i=0;this.pos=new Float32Array(n*3);this.col=new Float32Array(n*3);this.base=new Float32Array(n*3);this.vel=new Float32Array(n*3);this.life=new Float32Array(n);this.max=new Float32Array(n);this.drag=new Float32Array(n);this.grav=new Float32Array(n);
    for(let i=0;i<n;i++)this.pos[i*3+1]=-999;
    const g=new THREE.BufferGeometry();this.pa=new THREE.BufferAttribute(this.pos,3);this.ca=new THREE.BufferAttribute(this.col,3);g.setAttribute('position',this.pa);g.setAttribute('color',this.ca);
    this.pts=new THREE.Points(g,new THREE.PointsMaterial({size,map:tex,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));this.pts.frustumCulled=false;scene.add(this.pts);}
  emit(p,v,c,life,drag=1,grav=0){const i=this.i;this.i=(i+1)%this.n;this.pos.set([p.x,p.y,p.z],i*3);this.vel.set([v.x,v.y,v.z],i*3);this.base.set([c.r,c.g,c.b],i*3);this.life[i]=this.max[i]=life;this.drag[i]=drag;this.grav[i]=grav;}
  update(dt){const P=this.pos,Vv=this.vel,Cc=this.col,B=this.base;for(let i=0;i<this.n;i++){if(this.life[i]<=0)continue;this.life[i]-=dt;const j=i*3;
    if(this.life[i]<=0){P[j+1]=-999;Cc[j]=Cc[j+1]=Cc[j+2]=0;continue;}
    const d=Math.max(0,1-this.drag[i]*dt);Vv[j]*=d;Vv[j+1]=Vv[j+1]*d-this.grav[i]*dt;Vv[j+2]*=d;P[j]+=Vv[j]*dt;P[j+1]+=Vv[j+1]*dt;P[j+2]+=Vv[j+2]*dt;
    const f=this.life[i]/this.max[i];Cc[j]=B[j]*f;Cc[j+1]=B[j+1]*f;Cc[j+2]=B[j+2]*f;}
    this.pa.needsUpdate=this.ca.needsUpdate=true;}
}
const sparks=new Pool(6000,.22), glows=new Pool(1500,.75);
function rndDir(){const u=R(-1,1),t=R(0,Math.PI*2),s=Math.sqrt(1-u*u);return V(s*Math.cos(t),u,s*Math.sin(t));}
function burst(p,{colors,n=60,speed=5,life=[.4,1],grav=0,drag=1.5,pool=sparks,up=0,flat=false}){
  const cs=colors.map(C);for(let i=0;i<n;i++){const d=rndDir();if(flat)d.y=Math.abs(d.y)*.25;const v=d.multiplyScalar(speed*R(.3,1));v.y+=up;pool.emit(p,v,pick(cs),R(life[0],life[1]),drag,grav);}}

/* 絵の小物（煙、絵文字、文字） */
const sprites=[];
function spawnSprite({tex=puffTex,color=0xffffff,pos,vel=V(),life=1,size=1,grow=0,grav=0,spin=0,add=false,opacity=1,drag=0}){
  const m=new THREE.SpriteMaterial({map:tex,color,transparent:true,depthWrite:false,opacity,blending:add?THREE.AdditiveBlending:THREE.NormalBlending});
  const s=new THREE.Sprite(m);s.position.copy(pos);s.scale.setScalar(size);scene.add(s);
  sprites.push({s,m,vel:vel.clone(),life,max:life,size,grow,grav,spin,opacity,drag});return s;}
function updateSprites(dt){for(let i=sprites.length-1;i>=0;i--){const o=sprites[i];o.life-=dt;if(o.life<=0){scene.remove(o.s);o.m.dispose();sprites.splice(i,1);continue;}
  o.vel.y-=o.grav*dt;o.vel.multiplyScalar(Math.max(0,1-o.drag*dt));o.s.position.addScaledVector(o.vel,dt);const f=o.life/o.max;o.size+=o.grow*dt;o.s.scale.setScalar(Math.max(.01,o.size));o.m.rotation+=o.spin*dt;o.m.opacity=o.opacity*Math.min(1,f*2.5);}}
function smoke(p,n,color=0x5a5468,size=1){for(let i=0;i<n;i++)spawnSprite({pos:p.clone().add(V(R(-.4,.4),R(0,.4),R(-.4,.4)).multiplyScalar(size)),vel:V(R(-.6,.6),R(.4,1.4),R(-.6,.6)).multiplyScalar(size),life:R(.8,1.6),size:R(.8,1.3)*size,grow:1.2*size,color,opacity:.55,drag:1});}
function popText(str,p,color='#fff',size=1.4,life=1.2){return spawnSprite({tex:textTex(str,color),pos:p,vel:V(0,1.2,0),life,size,drag:1.5});}

/* 光、画面、揺れ */
const lights=[];for(let i=0;i<6;i++){const l=new THREE.PointLight(0xffffff,0,14,2);l.userData.t=0;scene.add(l);lights.push(l);}
function flashLight(p,color,intensity,dur){const l=lights.reduce((a,b)=>a.userData.t<b.userData.t?a:b);l.position.copy(p);l.color.set(color);l.userData={t:dur,max:dur,i:intensity};return l;}
function updateLights(dt){for(const l of lights){const u=l.userData;if(u.t>0){u.t-=dt;l.intensity=u.i*Math.max(0,u.t/u.max);}else l.intensity=0;}}
const flashEl=$('#flash');
function screenFlash(color,alpha=.5,dur=.35){if(reduceMotion)alpha*=.3;flashEl.style.transition='none';flashEl.style.background=color;flashEl.style.opacity=alpha;void flashEl.offsetWidth;flashEl.style.transition=`opacity ${dur}s ease-out`;flashEl.style.opacity=0;}
let shakeAmt=0;function shake(a){if(!reduceMotion)shakeAmt=Math.min(1.4,shakeAmt+a);}
const bannerEl=$('#banner');let bannerT=0;
function banner(name,lv,color){bannerEl.innerHTML=`${name}<small>${'★'.repeat(lv)}${'☆'.repeat(5-lv)}</small>`;bannerEl.style.setProperty('--bc',color);bannerEl.classList.add('show');bannerT=1.3+lv*.15;}

/* 時間（効果は game 時間、止める効果は実時間） */
let timeScale=1;const fx=[],realFx=[];
function addFx(f){fx.push(f);}
function later(sec,f){let t=0;addFx(dt=>{t+=dt;if(t>=sec){f();return false;}return true;});}
function during(sec,f,end){let t=0;addFx(dt=>{t+=dt;f(dt,t/sec,t);if(t>=sec){end&&end();return false;}return true;});}

/* ---------- 登場人物 ---------- */
const ST={
  burn:{tint:0xff5a1a,amt:.45,emit:(a,p)=>Math.random()<.5&&sparks.emit(p.add(V(R(-.3,.3),R(0,1),R(-.3,.3))),V(0,R(1,2.5),0),C(pick([0xffb347,0xff5a1a])),R(.3,.7),1)},
  freeze:{tint:0x9fe8ff,amt:.75,still:true},
  stone:{tint:0x8d8a86,amt:.95,still:true},
  frog:{tint:0x4bd14b,amt:.85,sx:.5,sy:.5},
  grow:{sx:1.75,sy:1.75},shrink:{sx:.42,sy:.42},
  float:{lift:1.8,bob:1},spin:{spin:14},tornado:{lift:2.6,spin:22},
  charm:{tint:0xff7ab8,amt:.45,sway:1,emit:(a,p)=>Math.random()<.06&&spawnSprite({tex:textTex('💗'),pos:p.add(V(R(-.4,.4),1.4,R(-.4,.4))),vel:V(0,1,0),life:1.2,size:.5})},
  curse:{tint:0x8a3dff,amt:.55,emit:(a,p)=>Math.random()<.3&&glows.emit(p.add(V(R(-.6,.6),R(0,2),R(-.6,.6))),V(0,R(.3,1),0),C(0x7a2dff),R(.5,1),.5)},
  poison:{tint:0x6dff4a,amt:.5,emit:(a,p)=>Math.random()<.12&&spawnSprite({tex:bubbleTex,color:0x8dff5a,pos:p.add(V(R(-.4,.4),R(.5,2),R(-.4,.4))),vel:V(0,.8,0),life:.9,size:.35,grow:.2})},
  sleep:{tilt:.45,still:true,emit:(a,p)=>Math.random()<.035&&spawnSprite({tex:textTex('Z','#cfd8ff'),pos:p.add(V(.3,2.6,0)),vel:V(.4,.7,0),life:1.6,size:.6,grow:.3})},
  invisible:{alpha:.1},

    if(u>=1){burst(end,{colors:[0xffe08a,0xffffff,0xff9a4a],n:120*k,speed:6*k});t.hit(1.2);shake(.2*k);if(big)t.addStatus('burn',2);s.material.opacity=0;return false;}return true;});}},
 {id:'rain',name:'レイン',color:0x6ab8ff,mode:'world',once:true,words:['雨','あめ','れいん','豪雨','ごうう','降れ','ふれ','時雨'],
  run:({k})=>{during(2.5,()=>{for(let i=0;i<40*k;i++)sparks.emit(V(R(-9,9),R(8,12),R(-8,6)),V(-1,-18,0),C(pick([0x6ab8ff,0xa8d4ff])),.6,0);});FOES.forEach(f=>later(.6,()=>f.addStatus('wet',3)));scene.fog.color.set(0x141a2c);later(2.5,()=>scene.fog.color.set(0x0d0b1c));}},
 {id:'rainbow',name:'虹',color:0xff9ae0,mode:'world',once:true,words:['虹','にじ','れいんぼー','七色','なないろ','希望'],
  run:()=>{const cols=[0xff4a4a,0xff9a3a,0xffe14a,0x5aff6a,0x4ac8ff,0x5a6aff,0xb56aff];during(3,(dt,u)=>{cols.forEach((c,i)=>{for(let j=0;j<3;j++){const a=R(0,Math.PI)*Math.min(1,u*3);const r=9-i*.35;glows.emit(V(Math.cos(a)*r,Math.sin(a)*r*.75,-6),V(0,0,0),C(c),.5,0);}});});}},
 {id:'laser',name:'レーザー',color:0xff4a8a,mode:'attack',words:['びーむ','光線','こうせん','れーざー','波動','はどう','ぶらすたー','ほう','砲'],
  run:({from,t,k,lv})=>{const to=t.center();const len=from.distanceTo(to);const mk=(r,c,o)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,16,1,true),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false}));m.position.lerpVectors(from,to,.5);m.quaternion.setFromUnitVectors(V(0,1,0),V().subVectors(to,from).normalize());scene.add(m);return m;};
   const a=mk(.25*k,0xff4a8a,.6),b=mk(.09*k,0xffffff,.95);flashLight(to,0xff4a8a,5*k,.9);t.hit(1.4);shake(.25*k);if(lv>=3)screenFlash('#ffd0e4',.3,.4);
   during(.8,(dt,u)=>{const w=1+Math.sin(u*80)*.15;a.scale.set(w*(1-u*.6),1,w*(1-u*.6));a.material.opacity=.6*(1-u);b.material.opacity=.95*(1-u);burst(to,{colors:[0xffffff,0xff4a8a],n:6*k,speed:5});},()=>{removeMesh(a);removeMesh(b);});}},
];
const FX_BY_ID=Object.fromEntries(FX.map(f=>[f.id,f]));

/* ---------- 呪文を読む（文字の似ている度合いで効果を探す） ---------- */
const TARGET_WORDS=[
  {sel:'allFoes',words:['全員','ぜんいん','みんな','皆','すべて','全て','総て','一網打尽','まとめて']},
  {sel:'allFriends',words:['仲間','なかま','味方','みかた','我ら','われら']},
  {sel:'self',words:['自分','じぶん','我が身','わがみ','私','わたし','己','おのれ','我に','われに']},
  {sel:'pos2',words:['右','みぎ']},{sel:'pos0',words:['左','ひだり']},{sel:'pos1',words:['真ん中','まんなか','中央','ちゅうおう']},
  ...foeDefs.map((d,i)=>({sel:'foe'+i,words:d[2]})),...mageDefs.map((d,i)=>({sel:'mage'+i,words:d[2]})),
];
const POWER_WORDS=['大いなる','おおいなる','偉大','究極','きゅうきょく','極','超','真なる','神','禁断','きんだん','古の','いにしえ','我が名','わがな','めが','ぎが','てら','ぐれーと','はいぱー','すーぱー','最強','さいきょう','最大','全力','ぜんりょく','終焉','しゅうえん','万象','ばんしょう','根源','こんげん','盟約','めいやく','覚醒','かくせい','永劫','えいごう','滅','めつ','奥義','おうぎ','秘儀','ひぎ'];
const SMALL_WORDS=['ぷち','ちょっと','少し','すこし','小さな','みに','軽く','かるく','そっと','ちび'];
function norm(s){return s.normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));}
const KANJI=/[一-鿿]/;
function grams(s){const g=new Set();if(s.length===1){g.add(s);return g;}for(let i=0;i<s.length-1;i++)g.add(s.slice(i,i+2));return g;}
function mask(s,w){let i,hit=0;const wn=norm(w);while(wn&&(i=s.indexOf(wn))>=0){s=s.slice(0,i)+'＿'.repeat(wn.length)+s.slice(i+wn.length);hit++;}return [s,hit];}
const FX_KEYS=FX.flatMap(f=>f.words.map(w=>{const n=norm(w);return {f,w:n,g:grams(n),wt:n.length===1?(KANJI.test(n)?.75:.4):Math.min(1,.55+.15*n.length)};}));
function analyze(text){
  const raw=text.trim();let s=norm(raw);
  let sel=null,selWord='';for(const t of TARGET_WORDS){for(const w of [...t.words].sort((a,b)=>b.length-a.length)){let h;[s,h]=mask(s,w);if(h&&!sel){sel=t.sel;selWord=w;}}}
  let pw=0,sw=0;for(const w of POWER_WORDS){let h;[s,h]=mask(s,w);pw+=h;}for(const w of SMALL_WORDS){let h;[s,h]=mask(s,w);sw+=h;}
  const q=s.replace(/[\s、。,.!?！？・「」『』…〜~]/g,'');const qg=new Set();for(let i=0;i<q.length;i++){qg.add(q[i]);if(i<q.length-1)qg.add(q.slice(i,i+2));}
  const best={};for(const k of FX_KEYS){let hit=0;for(const g of k.g)if(qg.has(g))hit++;const sc=hit/k.g.size*k.wt;if(sc>(best[k.f.id]?.score||0))best[k.f.id]={f:k.f,score:sc,w:k.w};}
  const found=Object.values(best).filter(b=>b.score>=.6).sort((a,b)=>b.score-a.score);
  const L=raw.replace(/[\s、。,.!?！？・「」『』…〜~]/g,'').length;const clauses=raw.split(/[\s、。,.!?！？・]+/).filter(Boolean).length;
  const power=L/6+(clauses-1)*.8+found.length*.9+pw*1.3-sw*2.2;
  const lv=Math.max(1,Math.min(5,1+Math.floor(power/2.2)));
  const maxFx=lv>=4?3:lv>=2?2:1;
  return {raw,sel,selWord,lv,power,found:found.slice(0,maxFx),fail:!found.length};
}
function resolveTargets(sel,mode,caster,lv,explicit){
  const pool=mode==='buff'?MAGES:FOES;
  if(sel==='allFoes')return mode==='buff'?MAGES:FOES;
  if(sel==='allFriends')return MAGES;
  if(sel==='self')return [caster];
  if(sel&&sel.startsWith('pos'))return [pool[+sel[3]]];
  if(sel&&sel.startsWith('foe'))return [FOES[+sel[3]]];
  if(sel&&sel.startsWith('mage'))return [MAGES[+sel[4]]];
  if(mode==='buff')return lv>=5?MAGES:[caster];
  return lv>=5?FOES:[FOES[caster.i]];
}

/* ---------- 溜めと発動 ---------- */
let active=MAGES[0],charge=null;
function startCharge(m){if(charge)cancelCharge();
  const circ=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:circleTex,color:0xbfd4ff,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  circ.rotation.x=-Math.PI/2;circ.position.copy(m.feet()).setY(.04);scene.add(circ);
  charge={m,circ,t:0,color:C(0xbfd4ff),power:0,lv:1};m.raiseTo=1;
  addFx(dt=>{if(!charge||charge.circ!==circ)return false;charge.t+=dt;const size=Math.min(1,charge.t/.5)*(2.4+charge.lv*.7);circ.scale.setScalar(size);circ.rotation.z+=dt*(1+charge.lv*.4);
    circ.material.color.lerp(charge.color,Math.min(1,dt*6));m.tipGlow.material.color.copy(circ.material.color);m.tipGlow.scale.setScalar(.7+charge.lv*.25+Math.sin(charge.t*20)*.05);
    const tip=m.tip();for(let i=0;i<2+charge.lv*2;i++){const d=rndDir().multiplyScalar(R(1.2,1.8+charge.lv*.3));sparks.emit(tip.clone().add(d),d.multiplyScalar(-2.2),charge.color,.42,0);}
    if(Math.random()<.2*charge.lv)sparks.emit(m.feet().add(V(R(-1,1),0,R(-1,1)).multiplyScalar(size*.4)),V(0,R(1,3),0),charge.color,.8,.3);return true;});}
function updateCharge(a){if(!charge)return;charge.lv=a.lv;const f=a.found[0]?.f;charge.color=C(f?f.color:0xbfd4ff);}
function endCircle(){if(!charge)return null;const c=charge;charge=null;c.m.raiseTo=0;c.m.tipGlow.material.color.set(0xffd98a);c.m.tipGlow.scale.setScalar(.7);
  const circ=c.circ;const s0=circ.scale.x;during(.35,(dt,u)=>{circ.scale.setScalar(s0*(1+u*.5));circ.material.opacity=1-u;},()=>{scene.remove(circ);circ.geometry.dispose();});return c;}
function cancelCharge(){endCircle();}
function release(a){const c=endCircle();const m=c?c.m:active;showVerdict(a);if(a.fail){fizzle(m);return;}cast(m,a);}
function cast(m,a){
  const lv=a.lv,k=[.6,.85,1.1,1.45,1.9][lv-1];const tip=m.tip();const main=a.found[0].f;
  banner(a.found.map(f=>f.f.name).join('＋'),lv,'#'+C(main.color).getHexString());
  const fc=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:circleTex,color:main.color,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  fc.position.copy(tip).add(V(0,0,-.5));scene.add(fc);during(.5,(dt,u)=>{fc.scale.setScalar(.5+u*(1.2+lv*.4));fc.rotation.z+=dt*4;fc.material.opacity=1-u;},()=>{scene.remove(fc);fc.geometry.dispose();});
  burst(tip,{colors:[main.color,0xffffff],n:30*k,speed:3});flashLight(tip,main.color,2+lv,.4);
  if(lv>=4){screenFlash('#'+C(main.color).getHexString(),.25,.4);shake(.15);}
  if(lv>=5){realFx.push((()=>{let t=0;return dt=>{t+=dt;timeScale=t<.5?.35:1;return t<.5;};})());ring(m.feet(),main.color,{to:9,dur:1});ring(m.feet(),0xffffff,{to:6,dur:.7});}
  a.found.forEach((b,j)=>later(j*.55,()=>{const f=b.f;
    if(f.once){f.run({caster:m,k,lv,from:m.tip()});return;}
    const targets=resolveTargets(a.sel,f.mode,m,lv);
    targets.forEach((t,i)=>later(i*.12,()=>f.run({caster:m,t,k,lv,from:m.tip()})));}));
}
function fizzle(m){const tip=m.tip();burst(tip,{colors:[0xffb070,0x9a9090,0xffffff],n:70,speed:4,grav:3});smoke(tip,8,0x4a4550,.9);flashLight(tip,0xffa060,3,.4);
  m.addStatus('soot',2.4);m.addStatus('knock',.9);m.hatV=7;shake(.12);popText('ぷすん…',m.top().add(V(0,.6,0)),'#cfc8e0',1.3,1.6);}

/* ---------- 画面 ---------- */
const casterBox=$('.casters');
MAGES.forEach((m,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('role','radio');b.textContent=m.name;b.setAttribute('aria-checked',i===0);
  b.onclick=()=>{active=m;casterBox.querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',x===b));};casterBox.appendChild(b);});
const heardEl=$('#heard'),verdictEl=$('#verdict'),noteEl=$('#note');
function showHeard(t){heardEl.textContent=t||'…';heardEl.classList.toggle('idle',!t);}
const SEL_LABEL=s=>!s?'':s==='allFoes'?'全員':s==='allFriends'?'仲間':s==='self'?'自分':s.startsWith('pos')?['左','真ん中','右'][+s[3]]:s.startsWith('foe')?foeDefs[+s[3]][0]:mageDefs[+s[4]][0];
function showVerdict(a){verdictEl.innerHTML='';const add=(html,cls='')=>{const e=document.createElement('span');e.className='chip '+cls;e.innerHTML=html;verdictEl.appendChild(e);};
  if(a.fail){add('詠唱失敗：辞書にない呪文','fail');return;}
  add(`威力 ${'★'.repeat(a.lv)}${'☆'.repeat(5-a.lv)}`,'lv');
  a.found.forEach(b=>add(`<i style="background:#${C(b.f.color).getHexString()}"></i>${b.f.name}（${b.w}）`));
  if(a.sel)add('対象：'+SEL_LABEL(a.sel));}
let castId=0;
function castText(text){if(!text.trim())return;const id=++castId;noteEl.textContent='';showHeard(text);verdictEl.innerHTML='';startCharge(active);
  const a=analyze(text);const dur=.5+a.lv*.25;let t=0;const chars=[...text];
  addFx(dt=>{if(id!==castId)return false;t+=dt;const part=chars.slice(0,Math.ceil(chars.length*Math.min(1,t/dur))).join('');updateCharge(analyze(part));if(t>=dur){release(a);return false;}return true;});}
$('#typed').addEventListener('submit',e=>{e.preventDefault();castText($('#spellText').value);});

let rec=null,listening=false;
$('#mic').addEventListener('click',()=>{
  if(listening&&rec){rec.stop();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){noteEl.textContent='このブラウザでは音声認識が使えません。Chrome で開くか、文字で唱えてください。';return;}
  rec=new SR();rec.lang='ja-JP';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=3;let done=false;
  rec.onstart=()=>{castId++;listening=true;$('#mic').classList.add('on');noteEl.textContent='';showHeard('');verdictEl.innerHTML='';startCharge(active);};
  rec.onresult=e=>{let txt='',fin=false;for(let i=0;i<e.results.length;i++){txt+=e.results[i][0].transcript;if(e.results[i].isFinal)fin=true;}showHeard(txt);updateCharge(analyze(txt));
    if(fin&&!done){done=true;const last=e.results[e.results.length-1];const head=txt.slice(0,txt.length-last[0].transcript.length);
      const cands=[...last].map(alt=>analyze(head+alt.transcript));const best=cands.find(c=>!c.fail)||cands[0];if(best.raw!==txt)showHeard(best.raw);release(best);}};
  rec.onerror=e=>{const m={'not-allowed':'マイクが使えません。ブラウザでマイクを許可するか、文字で唱えてください。','no-speech':'声が聞き取れませんでした。もう一度どうぞ。','network':'音声認識の通信に失敗しました。','audio-capture':'マイクが見つかりません。'}[e.error]||('音声認識が止まりました（'+e.error+'）');noteEl.textContent=m;};
  rec.onend=()=>{listening=false;$('#mic').classList.remove('on');if(!done)cancelCharge();};
  try{rec.start();}catch(err){noteEl.textContent='音声認識を始められませんでした。';}
});

const SAMPLES=['炎よ、我が手に集え、ファイアボール','あかに金だらい','凍てつけ、ブリザード','右をカエルにする','仲間に回復','出でよ、召喚獣','時よ止まれ','みどりに愛を','バナナの雨','大いなる天の雷よ、我が名において、全員に降り注げ','我、古の盟約に従い、深淵より来たる終焉の炎と隕石をもって、すべてを焼き尽くせ','ほにゃららぱー'];
SAMPLES.forEach(s=>{const b=document.createElement('button');b.type='button';b.textContent=s;b.onclick=()=>{$('#spellText').value=s;castText(s);};$('#samples').appendChild(b);});
$('#dict').innerHTML=FX.map(f=>`<div><b>${f.name}</b>：${f.words.slice(0,6).join('、')}</div>`).join('');

/* ---------- 回す ---------- */
let last=performance.now();
function loop(now){const rdt=Math.min(.05,(now-last)/1000);last=now;
  for(let i=realFx.length-1;i>=0;i--)if(!realFx[i](rdt))realFx.splice(i,1);
  const dt=rdt*timeScale;
  for(let i=fx.length-1;i>=0;i--)if(!fx[i](dt))fx.splice(i,1);
  sparks.update(dt);glows.update(dt);updateSprites(dt);updateLights(dt);ACTORS.forEach(a=>a.update(dt));
  floorCircle.rotation.z+=dt*.05;
  if(bannerT>0){bannerT-=rdt;if(bannerT<=0)bannerEl.classList.remove('show');}
  shakeAmt*=Math.exp(-rdt*5);camera.position.copy(camBase).add(V(R(-1,1),R(-1,1),0).multiplyScalar(shakeAmt*.35));camera.lookAt(camLook);
  renderer.render(scene,camera);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
window.__spell={castText,analyze,setActive:i=>{active=MAGES[i];}};
setTimeout(()=>castText('炎よ、我が手に集え、ファイアボール'),900);
})();
</script>
