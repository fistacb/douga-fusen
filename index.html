<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>動画の付箋</title>
<style>
/* layout: one column for a phone held upright: video on top (sticky), the note box under it, the notes as a list */
:root {
  --bg: #14171c; --panel: #1e232b; --line: #323a46; --fg: #eef0f3; --dim: #9aa3b0;
  --note: #f6d55c; --note-ink: #2a2410; --danger: #ff8a7a; --ok: #7fd6a4;
  --font: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--font); }
body { padding: 0 16px calc(24px + env(safe-area-inset-bottom, 0px)); max-width: 640px; margin-inline: auto; }
h1 { font-size: 17px; margin: 0; letter-spacing: .04em; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
button, .file { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 14px; min-height: 44px; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, .file:focus-within { outline: 2px solid var(--note); outline-offset: 2px; }
button.primary { background: var(--note); color: var(--note-ink); border-color: var(--note); font-weight: 700; }
button.ghost { background: none; }
button:disabled { opacity: .45; cursor: default; }
.file input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.stage { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg); padding-bottom: 8px; }
video { display: block; width: 100%; max-height: 42vh; background: #000; border-radius: 8px; }
.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 28px 16px; text-align: center; color: var(--dim); }
.bar { position: relative; height: 26px; margin-top: 6px; background: var(--panel); border-radius: 6px; touch-action: none; }
.bar .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: #3b4554; border-radius: 6px; }
.bar .pin { position: absolute; top: 3px; width: 6px; height: 20px; margin-left: -3px; background: var(--note); border-radius: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.time { font: 600 15px var(--mono); font-variant-numeric: tabular-nums; }
label.small { display: block; color: var(--dim); font-size: 12px; margin-bottom: 4px; }
input[type=text], textarea { width: 100%; font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 12px; }
textarea { min-height: 76px; resize: vertical; }
section { margin-top: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chips button { min-height: 36px; padding: 4px 12px; border-radius: 18px; font-size: 13px; }
ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; background: var(--note); color: var(--note-ink);
  border-radius: 4px 4px 4px 14px; padding: 10px 12px; }
li .t { font: 700 13px var(--mono); font-variant-numeric: tabular-nums; background: none; border: 0; color: inherit; padding: 2px 0; min-height: 0;
  text-decoration: underline; }
li .x { background: none; border: 0; color: inherit; min-height: 0; padding: 0 4px; font-size: 18px; line-height: 1.2; }
li p { margin: 0; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg { margin-top: 10px; min-height: 1.6em; color: var(--ok); font-size: 13px; }
.msg.bad { color: var(--danger); }
details { margin-top: 20px; color: var(--dim); font-size: 13px; }
details pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--panel); padding: 10px; border-radius: 8px; color: var(--fg); font: 12px/1.5 var(--mono); }
</style>
</head>
<body>
<header>
  <h1>動画の付箋</h1>
  <label class="file" id="pick">動画を選ぶ<input type="file" id="file" accept="video/*"></label>
</header>

<div class="stage">
  <div class="empty" id="empty">直したい動画を選んでください。<br>動画はこのスマホの中だけで再生し、どこにも送りません。</div>
  <video id="video" playsinline controls hidden></video>
  <div class="bar" id="bar" hidden><div class="fill" id="fill"></div></div>
</div>

<section>
  <label class="small" for="run">動画の名前（PCの runs フォルダの名前）</label>
  <input type="text" id="run" placeholder="例：機能紹介3" autocomplete="off">
</section>

<section>
  <div class="row" style="justify-content: space-between">
    <span>付箋を貼る時刻 <span class="time" id="now">0:00.0</span></span>
    <label class="row" style="gap:6px"><input type="checkbox" id="whole"> 動画全体へのメモ</label>
  </div>
  <textarea id="text" placeholder="例：ここはもっと寄りで　／　霧を濃く　／　この字幕を明朝体に"></textarea>
  <div class="chips" id="chips"></div>
  <div class="row" style="margin-top:10px">
    <button class="primary" id="add">この時刻に貼る</button>
    <button class="ghost" id="back">3秒戻る</button>
  </div>
</section>

<section>
  <div class="row" style="justify-content: space-between">
    <strong>貼った付箋 <span id="count">0</span>枚</strong>
    <button class="ghost" id="clear" hidden>全部はがす</button>
  </div>
  <ul id="list"></ul>
</section>

<section>
  <div class="row">
    <button class="primary" id="send" disabled>PCに送る</button>
    <button id="copy" disabled>中身をコピー</button>
  </div>
  <div class="msg" id="msg" role="status"></div>
</section>

<details>
  <summary>送り方と、うまくいかないとき</summary>
  <p>「PCに送る」を押すと共有メニューが開きます。<strong>ドライブ</strong>を選び、フォルダ「動画の付箋」に保存してください。PC が見つけて動画を直し、同じフォルダに直した動画と結果のメモを置きます。</p>
  <p>共有メニューが出ない場合は、付箋のファイルがダウンロードされます。ドライブのアプリで「動画の付箋」フォルダにアップロードしてください。</p>
  <p>送る中身：</p>
  <pre id="preview">{}</pre>
</details>

<script>
"use strict";
const $ = id => document.getElementById(id);
const video = $("video"), list = $("list");
const CHIPS = ["もっと寄りで", "引きで全身を", "下からあおって", "霧を濃く", "夜にして", "セピアに", "ここで1秒止める", "スローで", "この字幕を消す", "光の粒を足す"];
let notes = [];          // {t: seconds or null, text}
let confirmClear = false;

const fmt = t => t == null ? "全体" : Math.floor(t / 60) + ":" + (t % 60).toFixed(1).padStart(4, "0");
const key = () => "fusen:" + ($("run").value.trim() || "_");
function save() { try { localStorage.setItem(key(), JSON.stringify(notes)); } catch (e) {} }
function load() { try { notes = JSON.parse(localStorage.getItem(key()) || "[]"); } catch (e) { notes = []; } render(); }
function payload() { return { run: $("run").value.trim(), made: new Date().toISOString(), notes: notes.map(n => n.t == null ? { text: n.text } : { t: Math.round(n.t * 10) / 10, text: n.text }) }; }
function say(text, bad) { $("msg").textContent = text; $("msg").className = "msg" + (bad ? " bad" : ""); }

function render() {
  notes.sort((a, b) => (a.t == null ? -1 : a.t) - (b.t == null ? -1 : b.t));
  list.textContent = "";
  notes.forEach((n, i) => {
    const li = document.createElement("li"), t = document.createElement("button"), p = document.createElement("p"), x = document.createElement("button");
    t.className = "t"; t.textContent = fmt(n.t); t.title = "この時刻へ移動";
    t.onclick = () => { if (n.t != null && video.src) { video.currentTime = n.t; video.pause(); } };
    p.textContent = n.text;
    x.className = "x"; x.textContent = "×"; x.setAttribute("aria-label", "この付箋をはがす");
    x.onclick = () => { notes.splice(i, 1); save(); render(); };
    li.append(t, p, x); list.append(li);
  });
  $("count").textContent = notes.length;
  $("clear").hidden = !notes.length;
  const ready = notes.length > 0 && $("run").value.trim() !== "";
  $("send").disabled = $("copy").disabled = !ready;
  $("preview").textContent = JSON.stringify(payload(), null, 1);
  document.querySelectorAll(".pin").forEach(e => e.remove());
  if (video.duration) notes.forEach(n => { if (n.t != null) { const d = document.createElement("div"); d.className = "pin"; d.style.left = (100 * n.t / video.duration) + "%"; $("bar").append(d); } });
}

$("file").onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  video.src = URL.createObjectURL(f);
  video.hidden = false; $("bar").hidden = false; $("empty").hidden = true;
  if (!$("run").value.trim()) $("run").value = f.name.replace(/\.[^.]+$/, "");
  load();
};
video.ontimeupdate = () => { $("now").textContent = fmt(video.currentTime); if (video.duration) $("fill").style.width = (100 * video.currentTime / video.duration) + "%"; };
video.onloadedmetadata = render;
$("bar").onpointerdown = e => { if (video.duration) { const r = $("bar").getBoundingClientRect(); video.currentTime = video.duration * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); } };
$("run").oninput = load;
$("back").onclick = () => { video.currentTime = Math.max(0, video.currentTime - 3); };
$("text").onfocus = () => { if (video.src) video.pause(); };
CHIPS.forEach(c => { const b = document.createElement("button"); b.textContent = c; b.onclick = () => { if (video.src) video.pause(); const t = $("text"); t.value = (t.value ? t.value + "。" : "") + c; }; $("chips").append(b); });
$("add").onclick = () => {
  const text = $("text").value.trim();
  if (!text) { say("付箋に書く言葉を入れてください。", true); return; }
  notes.push({ t: $("whole").checked || !video.src ? null : video.currentTime, text });
  $("text").value = ""; $("whole").checked = false; say("");
  save(); render();
};
$("clear").onclick = () => {
  if (!confirmClear) { confirmClear = true; $("clear").textContent = "本当に全部はがす"; setTimeout(() => { confirmClear = false; $("clear").textContent = "全部はがす"; }, 4000); return; }
  notes = []; confirmClear = false; $("clear").textContent = "全部はがす"; save(); render();
};
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(JSON.stringify(payload())); say("コピーしました。"); }
  catch (e) { say("コピーできませんでした。下の「送る中身」を長押しして選んでください。", true); }
};
$("send").onclick = async () => {
  const p = payload(), stamp = p.made.replace(/[-:T]/g, "").slice(0, 14);
  const name = p.run.replace(/[\\/:*?"<>|]/g, "_") + "_notes_" + stamp + ".json";
  const file = new File([JSON.stringify(p, null, 1)], name, { type: "application/json" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); say("共有メニューに渡しました。ドライブの「動画の付箋」に保存すると、PC が直しはじめます。"); return; }
    catch (e) { if (e.name === "AbortError") { say("送るのをやめました。付箋は残っています。"); return; } }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = name; document.body.append(a); a.click(); a.remove();
  say("共有メニューが使えないので、ファイルをダウンロードしました（" + name + "）。ドライブの「動画の付箋」にアップロードしてください。");
};
render();
</script>
</body>
</html>
